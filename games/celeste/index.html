<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Celeste Classic (PICO-8)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            max-width: 100vmin;
            max-height: 100vmin;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
            background: #000;
        }
        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #090d16;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #312e81;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p style="font-size: 14px; font-weight: 600; color: #a5b4fc;">Iniciando Celeste Classic...</p>
    </div>

    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault();"></canvas>

    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                var l = document.getElementById('loader');
                if (l) {
                    l.style.opacity = '0';
                    setTimeout(function() { l.remove(); }, 350);
                }
                var c = document.getElementById('canvas');
                if (c) c.focus();
            }
        };

        // Fallback Lexaloffle embed or direct loader
        window.addEventListener('DOMContentLoaded', function() {
            var script = document.createElement('script');
            script.src = 'https://www.lexaloffle.com/play/pico8_0207.js';
            script.onload = function() {
                if (typeof p8_run_cart === 'function') {
                    p8_run_cart(
                        'https://www.lexaloffle.com/play/pico8_0207.js',
                        'celeste-3',
                        'https://www.lexaloffle.com/bbs/cposts/ce/celeste-3.p8.png'
                    );
                }
            };
            script.onerror = function() {
                // If lexaloffle blocks sub-script, embed clean widget fallback iframe
                document.body.innerHTML = '<iframe src="https://www.lexaloffle.com/bbs/widget.php?pid=celeste" style="width:100vw;height:100vh;border:none;" allow="autoplay; gamepad"></iframe>';
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
