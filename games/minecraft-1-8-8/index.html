		<script type="text/javascript">
			// RetroCloud Master Volume Controller for WebAudio & Eaglercraft
			(function() {
				const OrigCtx = window.AudioContext || window.webkitAudioContext;
				if (!OrigCtx) return;
				let currentVol = 0.7;
				window.__masterGains = [];
				window.setGameVolume = function(val) {
					currentVol = Math.max(0, Math.min(1, val));
					window.__masterGains.forEach(g => {
						try { g.gain.setValueAtTime(currentVol, g.context.currentTime); } catch(e){}
					});
				};
				window.addEventListener('message', function(e) {
					let d = e.data;
					if (typeof d === 'string') { try { d = JSON.parse(d); } catch(err){} }
					if (d && (d.type === 'setVolume' || d.action === 'setVolume' || d.command === 'setVolume')) {
						const v = typeof d.value === 'number' ? d.value : d.volume;
						if (typeof v === 'number') window.setGameVolume(v);
					}
				});
				function WrappedCtx(...args) {
					const ctx = new OrigCtx(...args);
					const mg = ctx.createGain();
					mg.gain.setValueAtTime(currentVol, ctx.currentTime);
					mg.connect(ctx.destination);
					window.__masterGains.push(mg);
					const origConn = AudioNode.prototype.connect;
					AudioNode.prototype.connect = function(dest, ...rest) {
						if (dest === ctx.destination) return origConn.call(this, mg, ...rest);
						return origConn.call(this, dest, ...rest);
					};
					return ctx;
				}
				WrappedCtx.prototype = OrigCtx.prototype;
				window.AudioContext = WrappedCtx;
				if (window.webkitAudioContext) window.webkitAudioContext = WrappedCtx;
			})();
		</script>
		<script type="text/javascript" src="classes.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", () => {
				if(document.location.href.startsWith("file:")) {

				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					
					const relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epk",
						localesURI: "lang/",
						worldsDB: "worlds",
						servers: [
                            { serverName: "Asspixel", serverAddress: "wss://web.asspixel.net/CAP/", hideAddress: false },
                            { serverName: "to request a server to add, email me", serverAddress: "vape.master.69@hotmail.com", hideAddress: false }
						],
						relays: [
                            { addr: "wss://eaglerrelay.glitch.me", comment: "Hellscaped LAN relay", primary: relayId == 0 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if(typeof q === "string" && q.startsWith("?")) {
						q = new URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					main();
					
				}
			});
