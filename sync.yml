name: Sync catalog

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/backup_catalog.py
      - run: python scripts/sync_catalog.py
      - run: python scripts/watchdog.py
      - run: python scripts/curate_catalog.py
      - run: python scripts/generate_sitemap.py
      - name: Commit changes
        run: |
          git config user.name "retrocloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add games.json sitemap.xml robots.txt backups/
          git diff --cached --quiet || git commit -m "chore: sync catalog, sitemap and backups" && git push
